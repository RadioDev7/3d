<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Мир с чанками</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: Arial; }
  #info {
    position: absolute; top: 10px; left: 10px; color: white;
    background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px;
    font-size: 14px; pointer-events: none; line-height: 1.5;
    transition: opacity 0.25s;
  }
  #info.hidden { opacity: 0; }
  #chunkinfo {
    position: absolute; top: 10px; right: 10px; color: white;
    background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; pointer-events: none; line-height: 1.4;
    transition: opacity 0.25s;
  }
  #chunkinfo.hidden { opacity: 0; }
  #toggle-hint {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    color: white; background: rgba(0,0,0,0.5); padding: 6px 14px;
    border-radius: 6px; font-size: 12px; pointer-events: none;
    transition: opacity 0.25s;
  }
  #toggle-hint.hidden { opacity: 0; }
  #hotbar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center;
  }
  .slot {
    width: 60px; height: 60px; border: 3px solid rgba(255,255,255,0.4);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: white; font-weight: bold; font-size: 22px;
    background: rgba(0,0,0,0.4); transition: 0.15s;
    text-shadow: 0 0 4px black; cursor: pointer;
  }
  .slot.active {
    border-color: #fff; transform: scale(1.15);
    box-shadow: 0 0 20px rgba(255,255,255,0.8);
  }
  #custom-color {
    width: 34px; height: 34px; border: none; cursor: pointer;
    background: none; padding: 0;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 20px; height: 20px; margin: -10px 0 0 -10px;
    pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: white;
    box-shadow: 0 0 3px black;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
  #lock-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: white; background: rgba(0,0,0,0.7); padding: 20px 40px;
    border-radius: 12px; font-size: 20px; text-align: center;
    pointer-events: none;
  }
  #reset-btn {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    color: white; background: rgba(180,40,40,0.7); border: 1px solid rgba(255,255,255,0.4);
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="info">
  <b>Управление:</b><br>
  WASD - движение, Пробел - прыжок<br>
  Мышь - обзор<br>
  ЛКМ - поставить блок<br>
  ПКМ - сломать блок<br>
  <b>1 / 2 / 3 / 4</b> или колесо - выбор блока<br>
  <b>H</b> - скрыть/показать меню
</div>
<div id="chunkinfo">Загрузка...</div>
<div id="toggle-hint">Нажмите <b>H</b> чтобы скрыть меню</div>
<div id="lock-hint">Кликните для начала игры</div>
<div id="crosshair"></div>
<button id="reset-btn">Сбросить сохранённый мир</button>
<div id="hotbar">
  <div class="slot" data-i="0" style="background: rgba(255,68,68,0.5)">1</div>
  <div class="slot" data-i="1" style="background: rgba(68,255,68,0.5)">2</div>
  <div class="slot" data-i="2" style="background: rgba(68,68,255,0.5)">3</div>
  <div class="slot" data-i="3" id="slot-custom" style="background: rgba(255,255,255,0.5)">4</div>
  <input type="color" id="custom-color" value="#ffaa00" title="Цвет кастомного куба">
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ========================================================
// БАЗОВАЯ НАСТРОЙКА
// ========================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 110);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 300);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 250;
scene.add(sun);

// ========================================================
// КОНСТАНТЫ
// ========================================================
const CHUNK_SIZE = 32;
const LOAD_RADIUS = 1;
const MAX_HEIGHT = 2;
const BUILD_HEIGHT = 24;
const HEIGHT_TOTAL = BUILD_HEIGHT + 1;
const GRAVITY = -22;

const AIR   = 0;
const GRASS = 1;
const DIRT  = 2;
const STONE = 3;
const RED   = 10;
const GREEN = 11;
const BLUE  = 12;

// Кастомные блоки: типы от CUSTOM_BASE до CUSTOM_MAX (255).
// Каждый уникальный цвет получает свой собственный тип блока и
// НАВСЕГДА сохраняет свой цвет, даже если поменять палитру.
const CUSTOM_BASE = 100;
const CUSTOM_MAX  = 255;

const UNLOADED = 254; // не пересекается с диапазоном кастомных типов

// ========================================================
// СОХРАНЕНИЕ (localStorage)
// ========================================================
const SAVE_KEY         = 'voxel_world_v1';
const COLOR_KEY        = 'voxel_custom_color';
const CUSTOM_COLORS_KEY = 'voxel_custom_colors_v1';

// дельты: { "cx,cz": { "lx,y,lz": blockType } }
let savedDeltas = {};
try { savedDeltas = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch(e) { savedDeltas = {}; }

let saveTimer = null;
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(savedDeltas)); } catch(e) {}
  }, 300); // дебаунс, чтобы не писать на каждый блок
}

document.getElementById('reset-btn').addEventListener('click', () => {
  localStorage.removeItem(SAVE_KEY);
  localStorage.removeItem(CUSTOM_COLORS_KEY);
  localStorage.removeItem(COLOR_KEY);
  location.reload();
});

// ========================================================
// ГЕНЕРАЦИЯ
// ========================================================
function noise2D(x, z) {
  let n = 0;
  n += Math.sin(x * 0.08) * Math.cos(z * 0.08) * 0.55;
  n += Math.sin(x * 0.17 + 1.3) * Math.cos(z * 0.17 + 0.7) * 0.3;
  n += Math.sin(x * 0.35 + 2.1) * Math.cos(z * 0.35 + 3.4) * 0.15;
  return n;
}
function getTerrainHeight(x, z) {
  return Math.round(((noise2D(x, z) + 1) / 2) * MAX_HEIGHT);
}

// ========================================================
// ХРАНИЛИЩЕ
// ========================================================
const chunks = new Map();
function chunkKey(cx, cz) { return `${cx},${cz}`; }
function localIndex(lx, y, lz) { return (lx * CHUNK_SIZE + lz) * HEIGHT_TOTAL + y; }

function generateChunkData(cx, cz) {
  const data = new Uint8Array(CHUNK_SIZE * CHUNK_SIZE * HEIGHT_TOTAL);
  const ox = cx * CHUNK_SIZE, oz = cz * CHUNK_SIZE;
  for (let lx = 0; lx < CHUNK_SIZE; lx++) {
    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
      const h = getTerrainHeight(ox + lx, oz + lz);
      for (let y = 0; y <= h; y++) {
        let type;
        if (y === h) type = GRASS;
        else if (y === 0) type = STONE;
        else type = DIRT;
        data[localIndex(lx, y, lz)] = type;
      }
    }
  }
  // применяем сохранённую дельту игрока
  const delta = savedDeltas[chunkKey(cx, cz)];
  if (delta) {
    for (const pos in delta) {
      const [lx, y, lz] = pos.split(',').map(Number);
      data[localIndex(lx, y, lz)] = delta[pos];
    }
  }
  return data;
}

function getBlockAt(x, y, z) {
  if (y < 0 || y >= HEIGHT_TOTAL) return AIR;
  const cx = Math.floor(x / CHUNK_SIZE);
  const cz = Math.floor(z / CHUNK_SIZE);
  const ch = chunks.get(chunkKey(cx, cz));
  if (!ch) return UNLOADED;
  const lx = x - cx * CHUNK_SIZE;
  const lz = z - cz * CHUNK_SIZE;
  return ch.data[localIndex(lx, y, lz)];
}

function setBlockAt(x, y, z, type) {
  if (y < 0 || y >= HEIGHT_TOTAL) return false;
  const cx = Math.floor(x / CHUNK_SIZE);
  const cz = Math.floor(z / CHUNK_SIZE);
  const ch = chunks.get(chunkKey(cx, cz));
  if (!ch) return false;
  const lx = x - cx * CHUNK_SIZE;
  const lz = z - cz * CHUNK_SIZE;
  ch.data[localIndex(lx, y, lz)] = type;

  // помечаем изменение и сохраняем дельту
  ch.modified = true;
  const key = chunkKey(cx, cz);
  if (!savedDeltas[key]) savedDeltas[key] = {};
  savedDeltas[key][`${lx},${y},${lz}`] = type;
  queueSave();
  return true;
}

// ========================================================
// ЦВЕТА И МАТЕРИАЛ
// ========================================================
const TYPE_COLORS = {
  [GRASS]: new THREE.Color(0x4caf50),
  [DIRT]:  new THREE.Color(0x8a6b4f),
  [STONE]: new THREE.Color(0x9a9a9a),
  [RED]:   new THREE.Color(0xff4444),
  [GREEN]: new THREE.Color(0x44ff44),
  [BLUE]:  new THREE.Color(0x4444ff)
};

// Текущий цвет, выбранный в палитре (для НОВЫХ кастомных блоков)
let customColor = new THREE.Color(localStorage.getItem(COLOR_KEY) || '#ffaa00');

// Карта: тип блока (>= CUSTOM_BASE) -> hex-цвет.
// Каждый кастомный блок навсегда привязан к своему типу и цвету.
let customColorMap = {};
try { customColorMap = JSON.parse(localStorage.getItem(CUSTOM_COLORS_KEY) || '{}'); } catch(e) { customColorMap = {}; }

function saveCustomColorMap() {
  try { localStorage.setItem(CUSTOM_COLORS_KEY, JSON.stringify(customColorMap)); } catch(e) {}
}

// Заполняем TYPE_COLORS загруженными кастомными цветами
for (const typeStr in customColorMap) {
  TYPE_COLORS[+typeStr] = new THREE.Color(customColorMap[typeStr]);
}

// Находит или создаёт тип блока под заданный цвет.
// Возвращает тип (>= CUSTOM_BASE) или null, если места нет.
function getCustomTypeForColor(hexColor) {
  const hexLower = hexColor.toLowerCase();
  // Ищем уже существующий тип с таким цветом
  for (const typeStr in customColorMap) {
    if (customColorMap[typeStr].toLowerCase() === hexLower) {
      return +typeStr;
    }
  }
  // Ищем свободный тип
  for (let t = CUSTOM_BASE; t <= CUSTOM_MAX; t++) {
    if (!(t in customColorMap)) {
      customColorMap[t] = hexColor;
      TYPE_COLORS[t] = new THREE.Color(hexColor);
      saveCustomColorMap();
      return t;
    }
  }
  console.warn('Закончились слоты для кастомных цветов (макс. ' + (CUSTOM_MAX - CUSTOM_BASE + 1) + ')');
  return null;
}

const colorInput = document.getElementById('custom-color');
const customSlot = document.getElementById('slot-custom');
colorInput.value = '#' + customColor.getHexString();
customSlot.style.background = 'rgba(' +
  Math.round(customColor.r*255) + ',' +
  Math.round(customColor.g*255) + ',' +
  Math.round(customColor.b*255) + ',0.5)';

colorInput.addEventListener('input', () => {
  customColor.set(colorInput.value);
  customSlot.style.background = 'rgba(' +
    Math.round(customColor.r*255) + ',' +
    Math.round(customColor.g*255) + ',' +
    Math.round(customColor.b*255) + ',0.5)';
  localStorage.setItem(COLOR_KEY, colorInput.value);
  // НЕ перекрашиваем существующие блоки — у них теперь свои зафиксированные цвета
});

const worldMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.9,
  metalness: 0.0,
  side: THREE.DoubleSide
});

// ========================================================
// КВАД
// ========================================================
function makeQuadPositions(cx, cy, cz, w, h, normal) {
  const n = new THREE.Vector3(normal.x, normal.y, normal.z);
  let u;
  if (Math.abs(n.y) > 0.5) u = new THREE.Vector3(1, 0, 0);
  else if (Math.abs(n.x) > 0.5) u = new THREE.Vector3(0, 0, 1);
  else u = new THREE.Vector3(1, 0, 0);
  const v = new THREE.Vector3().crossVectors(n, u).normalize();
  const hw = w / 2, hh = h / 2;
  const c = new THREE.Vector3(cx, cy, cz);
  return [
    c.clone().addScaledVector(u, -hw).addScaledVector(v, -hh),
    c.clone().addScaledVector(u,  hw).addScaledVector(v, -hh),
    c.clone().addScaledVector(u,  hw).addScaledVector(v,  hh),
    c.clone().addScaledVector(u, -hw).addScaledVector(v,  hh)
  ];
}

// ========================================================
// ПОСТРОЕНИЕ МЕША
// ========================================================
function buildChunkMesh(cx, cz) {
  const key = chunkKey(cx, cz);
  let ch = chunks.get(key);
  if (!ch) {
    ch = { data: generateChunkData(cx, cz), mesh: null, cx, cz, modified: !!savedDeltas[key] };
    chunks.set(key, ch);
  }
  if (ch.mesh) {
    scene.remove(ch.mesh);
    ch.mesh.geometry.dispose();
    ch.mesh = null;
  }

  const data = ch.data;
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;

  const getLocal = (lx, y, lz) => {
    if (y < 0 || y >= HEIGHT_TOTAL) return AIR;
    if (lx >= 0 && lx < CHUNK_SIZE && lz >= 0 && lz < CHUNK_SIZE) {
      return data[localIndex(lx, y, lz)];
    }
    return getBlockAt(ox + lx, y, oz + lz);
  };

  const isFaceVisible = (cur, nb) => cur !== AIR && nb === AIR;

  const positions = [];
  const normals = [];
  const colors = [];
  const indices = [];
  let vc = 0;

  const pushQuad = (verts, n, type) => {
    const base = vc;
    for (const p of verts) positions.push(p.x, p.y, p.z);
    for (let i = 0; i < 4; i++) normals.push(n.x, n.y, n.z);
    const c = TYPE_COLORS[type] || new THREE.Color(0xff00ff);
    for (let i = 0; i < 4; i++) colors.push(c.r, c.g, c.b);
    indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
    vc += 4;
  };

  // ВЕРХ / НИЗ (greedy)
  for (let y = 0; y < HEIGHT_TOTAL; y++) {
    for (let dir = 0; dir < 2; dir++) {
      const neighborY = dir === 0 ? y + 1 : y - 1;

      const mask = [];
      for (let lx = 0; lx < CHUNK_SIZE; lx++) {
        mask[lx] = [];
        for (let lz = 0; lz < CHUNK_SIZE; lz++) {
          const cur = getLocal(lx, y, lz);
          const nb = getLocal(lx, neighborY, lz);
          mask[lx][lz] = isFaceVisible(cur, nb) ? cur : AIR;
        }
      }

      for (let lx = 0; lx < CHUNK_SIZE; lx++) {
        for (let lz = 0; lz < CHUNK_SIZE; lz++) {
          const type = mask[lx][lz];
          if (type === AIR) continue;

          let w = 1;
          while (lx + w < CHUNK_SIZE && mask[lx + w][lz] === type) w++;

          let h = 1;
          while (lz + h < CHUNK_SIZE) {
            let ok = true;
            for (let dx = 0; dx < w; dx++)
              if (mask[lx + dx][lz + h] !== type) { ok = false; break; }
            if (!ok) break;
            h++;
          }

          for (let dx = 0; dx < w; dx++)
            for (let dz = 0; dz < h; dz++)
              mask[lx + dx][lz + dz] = AIR;

          const cxw = lx + w / 2;
          const czw = lz + h / 2;
          const cyw = dir === 0 ? y + 1 : y;
          const n = dir === 0 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, -1, 0);

          pushQuad(makeQuadPositions(cxw, cyw, czw, w, h, n), n, type);
        }
      }
    }
  }

  // БОКОВЫЕ
  for (let lx = 0; lx < CHUNK_SIZE; lx++) {
    for (let y = 0; y < HEIGHT_TOTAL; y++) {
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const type = getLocal(lx, y, lz);
        if (type === AIR) continue;
        const cyw = y + 0.5;

        if (isFaceVisible(type, getLocal(lx + 1, y, lz))) {
          const n = new THREE.Vector3(1, 0, 0);
          pushQuad(makeQuadPositions(lx + 1, cyw, lz + 0.5, 1, 1, n), n, type);
        }
        if (isFaceVisible(type, getLocal(lx - 1, y, lz))) {
          const n = new THREE.Vector3(-1, 0, 0);
          pushQuad(makeQuadPositions(lx, cyw, lz + 0.5, 1, 1, n), n, type);
        }
        if (isFaceVisible(type, getLocal(lx, y, lz + 1))) {
          const n = new THREE.Vector3(0, 0, 1);
          pushQuad(makeQuadPositions(lx + 0.5, cyw, lz + 1, 1, 1, n), n, type);
        }
        if (isFaceVisible(type, getLocal(lx, y, lz - 1))) {
          const n = new THREE.Vector3(0, 0, -1);
          pushQuad(makeQuadPositions(lx + 0.5, cyw, lz, 1, 1, n), n, type);
        }
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeBoundingSphere();

  const mesh = new THREE.Mesh(geo, worldMaterial);
  mesh.position.set(ox, 0, oz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  ch.mesh = mesh;
}

// ========================================================
// ЗАГРУЗКА / ВЫГРУЗКА ЧАНКОВ
// ========================================================
let currentChunkX = Infinity, currentChunkZ = Infinity;

function updateChunks() {
  const pcx = Math.floor(player.pos.x / CHUNK_SIZE);
  const pcz = Math.floor(player.pos.z / CHUNK_SIZE);
  if (pcx === currentChunkX && pcz === currentChunkZ) return;
  currentChunkX = pcx;
  currentChunkZ = pcz;

  const needed = new Set();
  for (let dx = -LOAD_RADIUS; dx <= LOAD_RADIUS; dx++)
    for (let dz = -LOAD_RADIUS; dz <= LOAD_RADIUS; dz++)
      needed.add(chunkKey(pcx + dx, pcz + dz));

  for (const [key, ch] of chunks) {
    if (!needed.has(key)) {
      if (ch.mesh) { scene.remove(ch.mesh); ch.mesh.geometry.dispose(); }
      chunks.delete(key); // данные изменённых чанков уже в savedDeltas
    }
  }
  for (const key of needed) {
    if (!chunks.has(key)) {
      const [cx, cz] = key.split(',').map(Number);
      buildChunkMesh(cx, cz);
    }
  }
}

// ========================================================
// ИГРОК
// ========================================================
const player = {
  pos: new THREE.Vector3(16, 10, 16),
  vel: new THREE.Vector3(),
  onGround: false,
  speed: 8,
  jumpSpeed: 8.5
};

function playerCollides(px, py, pz) {
  const r = 0.3, h = 1.7;
  for (const [ox, oz] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,0]]) {
    for (let y = Math.floor(py); y <= Math.floor(py + h); y++) {
      const b = getBlockAt(Math.floor(px + ox), y, Math.floor(pz + oz));
      if (b !== AIR && b !== UNLOADED) return true;
    }
  }
  return false;
}

// ========================================================
// УПРАВЛЕНИЕ
// ========================================================
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyH') {
    for (const id of ['info','chunkinfo','toggle-hint'])
      document.getElementById(id).classList.toggle('hidden');
  }
  if (e.code === 'Digit1') selectSlot(0);
  if (e.code === 'Digit2') selectSlot(1);
  if (e.code === 'Digit3') selectSlot(2);
  if (e.code === 'Digit4') selectSlot(3);
});
document.addEventListener('keyup', e => keys[e.code] = false);

let yaw = 0, pitch = 0;
let locked = false;
const lockHint = document.getElementById('lock-hint');

renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  lockHint.style.display = locked ? 'none' : 'block';
});
document.addEventListener('mousemove', e => {
  if (!locked) return;
  yaw -= e.movementX * 0.0025;
  pitch -= e.movementY * 0.0025;
  pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
});

// ХОТБАР
// Первые 3 слота — фиксированные типы. 4-й — "кастомный": тип вычисляется
// при постановке на основе текущего цвета из палитры (null = вычислять динамически).
const BLOCK_TYPES = [RED, GREEN, BLUE, null];
let activeSlot = 0;
const slots = document.querySelectorAll('.slot');
function selectSlot(i) {
  activeSlot = i;
  slots.forEach((s, idx) => s.classList.toggle('active', idx === i));
}
selectSlot(0);
slots.forEach((s, i) => s.addEventListener('click', () => selectSlot(i)));
addEventListener('wheel', e => {
  selectSlot((activeSlot + (e.deltaY > 0 ? 1 : BLOCK_TYPES.length - 1)) % BLOCK_TYPES.length);
});

// ========================================================
// БЛОКИ: поставить / сломать
// ========================================================
const raycaster = new THREE.Raycaster();
raycaster.far = 8;

function pickBlock() {
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const meshes = [...chunks.values()].map(c => c.mesh).filter(Boolean);
  const hits = raycaster.intersectObjects(meshes);
  if (!hits.length) return null;
  const hit = hits[0];
  const p = hit.point.clone().addScaledVector(hit.face.normal, -0.5);
  return { x: Math.floor(p.x), y: Math.floor(p.y), z: Math.floor(p.z) };
}
function pickPlacePos() {
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const meshes = [...chunks.values()].map(c => c.mesh).filter(Boolean);
  const hits = raycaster.intersectObjects(meshes);
  if (!hits.length) return null;
  const hit = hits[0];
  const p = hit.point.clone().addScaledVector(hit.face.normal, 0.5);
  return { x: Math.floor(p.x), y: Math.floor(p.y), z: Math.floor(p.z) };
}

document.addEventListener('mousedown', e => {
  if (!locked) return;
  if (e.button === 0) { // поставить
    const pos = pickPlacePos();
    if (!pos) return;
    if (getBlockAt(pos.x, pos.y, pos.z) !== AIR) return;

    // Определяем тип блока для постановки
    let blockType = BLOCK_TYPES[activeSlot];
    if (blockType === null) {
      // Кастомный — получаем (или создаём) тип под текущий цвет палитры
      const hex = '#' + customColor.getHexString();
      blockType = getCustomTypeForColor(hex);
      if (blockType === null) return; // нет свободных слотов
    }

    if (setBlockAt(pos.x, pos.y, pos.z, blockType)) {
      const cx = Math.floor(pos.x / CHUNK_SIZE), cz = Math.floor(pos.z / CHUNK_SIZE);
      buildChunkMesh(cx, cz);
      // соседние чанки, если блок на границе
      if (pos.x % CHUNK_SIZE === 0) buildChunkMesh(cx - 1, cz);
      if (pos.x % CHUNK_SIZE === CHUNK_SIZE - 1) buildChunkMesh(cx + 1, cz);
      if (pos.z % CHUNK_SIZE === 0) buildChunkMesh(cx, cz - 1);
      if (pos.z % CHUNK_SIZE === CHUNK_SIZE - 1) buildChunkMesh(cx, cz + 1);
    }
  } else if (e.button === 2) { // сломать
    const pos = pickBlock();
    if (pos && getBlockAt(pos.x, pos.y, pos.z) !== AIR) {
      if (setBlockAt(pos.x, pos.y, pos.z, AIR)) {
        const cx = Math.floor(pos.x / CHUNK_SIZE), cz = Math.floor(pos.z / CHUNK_SIZE);
        buildChunkMesh(cx, cz);
      }
    }
  }
});
document.addEventListener('contextmenu', e => e.preventDefault());

// ========================================================
// ИНФО О ЧАНКАХ
// ========================================================
const chunkInfo = document.getElementById('chunkinfo');
function updateChunkInfo() {
  chunkInfo.innerHTML =
    `Чанков загружено: <b>${chunks.size}</b><br>` +
    `Изменено игроком: <b>${Object.keys(savedDeltas).length}</b><br>` +
    `Позиция: ${Math.floor(player.pos.x)}, ${Math.floor(player.pos.y)}, ${Math.floor(player.pos.z)}`;
}

// ========================================================
// ГЛАВНЫЙ ЦИКЛ
// ========================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // движение
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(-forward.z, 0, forward.x);
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(player.speed);

  player.vel.x = move.x;
  player.vel.z = move.z;
  player.vel.y += GRAVITY * dt;
  if (keys['Space'] && player.onGround) {
    player.vel.y = player.jumpSpeed;
    player.onGround = false;
  }

  // коллизии по осям
  const np = player.pos.clone();
  np.x += player.vel.x * dt;
  if (!playerCollides(np.x, player.pos.y, player.pos.z)) player.pos.x = np.x;
  np.z += player.vel.z * dt;
  if (!playerCollides(player.pos.x, player.pos.y, np.z)) player.pos.z = np.z;
  np.y = player.pos.y + player.vel.y * dt;
  if (!playerCollides(player.pos.x, np.y, player.pos.z)) {
    player.pos.y = np.y;
    player.onGround = false;
  } else {
    if (player.vel.y < 0) player.onGround = true;
    player.vel.y = 0;
  }
  if (player.pos.y < -20) { player.pos.set(16, 10, 16); player.vel.set(0,0,0); }

  camera.position.copy(player.pos).add(new THREE.Vector3(0, 1.6, 0));
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  sun.position.set(player.pos.x + 40, 80, player.pos.z + 30);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();

  updateChunks();
  updateChunkInfo();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
